<!--
    Injected into the <head> of the Storybook manager (the page served at
    https://grauity.newtonschool.co). Storybook picks this file up automatically
    from .storybook/ — see https://storybook.js.org/docs/api/main-config/main-config-manager-head

    These are the tags link unfurlers (Slack, WhatsApp, X, LinkedIn, iMessage)
    read when someone shares the docs. They are static HTML on purpose: crawlers
    do not run the manager's JavaScript, so anything set at runtime is invisible
    to them. URLs must be absolute for the same reason.

    The image itself lives at public/og-image.png and is generated by
    `node scripts/og-image/render.mjs`.
-->

<meta
    name="description"
    content="gra.UI.ty is the design system and React component library behind Newton School. Browse every component, design token and icon, with live examples and usage docs."
/>

<link rel="apple-touch-icon" href="./apple-touch-icon.png" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="gra.UI.ty" />
<meta property="og:url" content="https://grauity.newtonschool.co/" />
<meta property="og:title" content="gra.UI.ty — Newton School Design System" />
<meta
    property="og:description"
    content="The design system and React component library behind Newton School. Browse every component, design token and icon, with live examples and usage docs."
/>
<meta
    property="og:image"
    content="https://grauity.newtonschool.co/og-image.png"
/>
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta
    property="og:image:alt"
    content="gra.UI.ty — the design system and React component library behind Newton School"
/>

<!-- X / Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="gra.UI.ty — Newton School Design System" />
<meta
    name="twitter:description"
    content="The design system and React component library behind Newton School. Browse every component, design token and icon, with live examples and usage docs."
/>
<meta
    name="twitter:image"
    content="https://grauity.newtonschool.co/og-image.png"
/>
